<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PwC TAC • Monthly VI+1</title><style>
:root{font-family:system-ui,Arial;color:#fff;background:#100b20}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 15%,#81375d55,transparent 40%),linear-gradient(135deg,#120b25,#23133c 60%,#102d3a)}main{max-width:1050px;margin:auto;padding:22px}.eyebrow{color:#6af3e9;letter-spacing:3px;font-weight:900;font-size:13px}h1{font-size:clamp(32px,7vw,68px);line-height:1;margin:10px 0;color:#ff75ba;text-shadow:4px 4px #3a176b;font-weight:1000}h2{color:#75fff0;margin:8px 0 14px}.card{background:#16142edb;border:1px solid #9b4a8c;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 15px 35px #0005}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button,input,select{font:inherit;padding:12px;border-radius:10px}button{background:#69358b;color:#fff;border:1px solid #ff8ccc;cursor:pointer}button:hover{background:#a24499}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77fff0}button:disabled{opacity:.45;cursor:default}.active{background:#127d80!important;border-color:#7bfff1}input,select{background:#fff;color:#1a1530;border:2px solid #ff83c5;max-width:100%}.field{margin:10px 0}.field label{display:block;margin-bottom:5px;font-weight:700}.choice{text-align:left;min-height:65px}.hidden{display:none!important}.subtle{color:#cfc1dc}.pill{display:inline-block;background:#54365c;padding:6px 12px;border-radius:30px;margin:4px;color:#fff}.bar{height:14px;background:#443455;border-radius:12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff66ba,#6bffee);width:100%;transition:width .3s}.score{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #5a456e;padding:9px 2px;gap:8px}.good{color:#83ffd3}.alert{background:#623c16;border:1px solid #ffd16e;padding:12px;border-radius:10px;margin:12px 0}.celebrate{animation:pop .65s ease both;color:#ffdf74;text-align:center;font-size:clamp(30px,6vw,65px);text-shadow:3px 3px #6e287c}@keyframes pop{0%{transform:scale(.5);opacity:0}75%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.transition{animation:enter .5s ease both}@keyframes enter{from{opacity:.3;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.loading{height:6px;background:#3e2850;overflow:hidden;border-radius:8px}.loading:after{content:'';display:block;width:40%;height:100%;background:#ff74bd;animation:load 1.2s infinite alternate}@keyframes load{to{transform:translateX(250%)}}.emoji{font-size:26px}.bigcode{font-size:30px;letter-spacing:5px;color:#ffda74}#notice{min-height:28px;color:#ffe08a}#intro{padding:20px 0}@media(max-width:720px){.layout,.grid{grid-template-columns:1fr}main{padding:12px}}
</style><main><div class="eyebrow">PwC TAC • CREW ONLINE</div><h1>MONTHLY VI+1</h1><p>THE TAC HEIST • GTA VI-inspired multiplayer • 40 players • 4 crews</p><div id="intro" class="card"><h2>🎮 Enter the game</h2><div class="loading"></div><div class="field"><label for="name">Player nickname</label><input id="name" maxlength="28" placeholder="e.g. SQL Ninja"></div><div class="field"><label for="room">Room code</label><input id="room" maxlength="6" placeholder="6-character code"></div><div class="field"><label for="team">Choose your crew</label><select id="team"><option value="0">⚡ Turbo Squad</option><option value="1">💻 Data Outlaws</option><option value="2">🔥 Bug Hunters</option><option value="3">🌴 Coffee Cartel</option></select></div><div class="field"><label for="avatar">Custom avatar</label><select id="avatar"></select></div><button id="join">Join the crew</button><hr><p class="subtle">Presenting the Monthly?</p><button id="create">🎤 Create host room</button></div><section id="app" class="hidden"><div class="layout"><div><div class="card transition" id="mission"><div class="eyebrow" id="status"></div><h2 id="title"></h2><p id="prompt"></p><div id="event" class="alert hidden"></div><div class="bar"><div class="fill" id="timer"></div></div><p id="timeLabel" class="subtle"></p><div id="options" class="grid"></div><p id="result" aria-live="polite"></p><div id="hostControls" class="hidden"><button id="start">Start the heist</button><button id="reveal">Reveal / finish round</button><button id="next">Next mission ➜</button></div></div></div><div><div class="card"><h2>🏆 Live leaderboard</h2><div id="playerScores"></div></div><div class="card"><h2>⚔️ Crew rankings</h2><div id="teamScores"></div></div></div></div></section><p id="notice" role="status" aria-live="polite"></p></main><script>
(()=>{const $=x=>document.getElementById(x),avatars=['😎','🕶️','🏍️','👾','🤖','🦊','🐺','🦄','👑','🧠','🔥','☕'],teams=['⚡ Turbo Squad','💻 Data Outlaws','🔥 Bug Hunters','🌴 Coffee Cartel'];avatars.forEach((a,i)=>{let o=document.createElement('option');o.value=i;o.textContent=a+' Avatar '+(i+1);$('avatar').append(o)});let code='',id='',token='',host=false,s=null,lastRound=-1,lastReveal=false,chosen=false,clock=null,es=null,soundOn=true;
function beep(f=520,d=.15){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);o.onended=()=>a.close()}catch{}}
async function post(route,data){let r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function warn(e){$('notice').textContent=e.message||String(e)}
function connect(){ $('intro').classList.add('hidden');$('app').classList.remove('hidden');es=new EventSource('/events?code='+encodeURIComponent(code));es.onmessage=e=>{s=JSON.parse(e.data);render()};es.onerror=()=>{$('notice').textContent='Connection interrupted. Reconnecting...'};}
$('create').onclick=async()=>{try{let x=await post('create',{});code=x.code;token=x.token;host=true;connect()}catch(e){warn(e)}};
$('join').onclick=async()=>{try{let x=await post('join',{code:$('room').value,name:$('name').value,team:Number($('team').value),avatar:Number($('avatar').value)});code=x.code;id=x.id;connect()}catch(e){warn(e)}};
async function action(a){try{await post('host',{code,token,action:a});beep(670,.1)}catch(e){warn(e)}}$('start').onclick=()=>action('start');$('reveal').onclick=()=>action('reveal');$('next').onclick=()=>action('next');
function button(text,fn,disabled=false){let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=text;b.disabled=disabled;b.addEventListener('click',fn);return b}function line(parent,left,right){let d=document.createElement('div');d.className='score';let a=document.createElement('span'),b=document.createElement('strong');a.textContent=left;b.textContent=right;d.append(a,b);parent.append(d)}
function render(){if(!s)return;$('notice').textContent='';let me=s.players.find(p=>p.id===id);$('status').textContent=(host?'HOST MODE • ':'PLAYER MODE • ')+'ROOM '+code+' • '+s.players.length+' players';$('hostControls').classList.toggle('hidden',!host);$('start').classList.toggle('hidden',s.phase!=='lobby');$('reveal').classList.toggle('hidden',s.phase!=='playing'||s.revealed);$('next').classList.toggle('hidden',s.phase!=='playing'||!s.revealed);$('playerScores').replaceChildren();s.players.slice(0,15).forEach((p,i)=>line($('playerScores'),(i+1)+'. '+avatars[p.avatar]+' '+p.name,p.xp+' XP'));$('teamScores').replaceChildren();s.teams.forEach((t,i)=>line($('teamScores'),(i+1)+'. '+teams[t.team]+' ('+t.count+')',t.xp+' XP'));
let opts=$('options');opts.replaceChildren();$('event').classList.add('hidden');$('timeLabel').textContent='';$('timer').style.width='100%';
if(s.phase==='lobby'){$('title').textContent='🎭 CREW ASSEMBLY';$('prompt').textContent='Share the game URL and code '+code+' in Teams. Players choose their avatar and crew. Host starts when everyone is ready.';$('result').textContent=host?'Waiting for your crew...':'Joined! Get ready for the first mission.';return}
if(s.phase==='finished'){let winner=s.players[0],team=s.teams[0];$('title').textContent='🏆 MISSION PASSED';$('prompt').textContent='PwC TAC Monthly VI+1 completed!';$('result').className='celebrate';$('result').textContent='🎉 '+(winner?winner.name+' WINS!':'CREW WINS!')+' 🎉';opts.append(button('Winning crew: '+teams[team.team]+' • '+team.xp+' XP',()=>{},true));if(!lastReveal){beep(880,.4);lastReveal=true}return}
if(lastRound!==s.round){lastRound=s.round;chosen=false;beep(440,.14);$('mission').classList.remove('transition');void $('mission').offsetWidth;$('mission').classList.add('transition')}
$('result').className='';$('title').textContent=(s.question.bonus?'🌟 BONUS ROUND • ':'⭐ MISSION '+(s.round+1)+' • ')+s.question.title;$('prompt').textContent=s.question.prompt;
if(s.event){$('event').classList.remove('hidden');$('event').textContent='🚨 RANDOM EVENT: '+s.event.name+' • '+s.event.detail}
let disabled=host||s.revealed||me?.answered||Date.now()>=s.deadline;s.question.options.forEach((x,i)=>opts.append(button('ABCD'[i]+' • '+x,async()=>{try{await post('answer',{code,id,answer:i});chosen=true;beep(650,.12);$('result').textContent='✅ Choice locked!'}catch(e){warn(e)}},disabled)));
if(s.revealed){$('result').textContent=s.question.correct===null?'🎉 CREW SPIRIT +50 XP! No wrong answers.':'✅ Correct answer: '+('ABCD'[s.question.correct])+' • '+s.question.options[s.question.correct]+' • XP awarded!';if(!lastReveal){beep(800,.3);lastReveal=true}}else{$('result').textContent=host?s.answers+' players answered. Reveal when ready.':me?.answered?'✅ Answer locked. Waiting for reveal.':'Choose your answer before time runs out!';lastReveal=false}
}
function tick(){if(!s||s.phase!=='playing')return;let left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));$('timeLabel').textContent=s.revealed?'ROUND COMPLETE':left+' seconds remaining • '+s.answers+' answers';$('timer').style.width=(s.revealed?0:Math.min(100,left/s.question.seconds*100))+'%';if(left===0&&!s.revealed)$('timeLabel').textContent='TIME UP • calculating scores...'}clock=setInterval(tick,250);
})();
</script></html>
