<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vice City Monthly - Multiplayer</title><style>:root{font-family:system-ui,Arial;background:#110c24;color:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#70265c,#170c2d 60%,#090e22);min-height:100vh}main{max-width:850px;margin:auto;padding:24px}h1{font-size:clamp(28px,6vw,52px);margin:12px 0;color:#ff74bd;text-shadow:2px 2px #4518a0}h2{color:#73fff1}.card{background:#171631e8;border:1px solid #b552a5;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #0005}button,input{font:inherit;border-radius:9px;padding:12px;margin:5px 4px 5px 0}input{background:#fff;color:#111;border:2px solid #ff74bd;max-width:100%;width:250px}button{border:1px solid #ff85d2;background:#752f8b;color:white;cursor:pointer}button:hover{background:#a83c9b}button:disabled{opacity:.5;cursor:default}.selected{background:#087d83!important;border-color:#73fff1}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid button{text-align:left;min-height:65px}.muted{color:#c8b9d6}.pill{color:#6ffff0;font-weight:bold;letter-spacing:1px}.score{display:flex;justify-content:space-between;border-bottom:1px solid #55456c;padding:7px}.good{color:#72ffd1}.bad{color:#ff9bac}#msg{min-height:28px;color:#ffdb7a}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><main><div class="pill">VICE CITY • MONTHLY VI • ONLINE CREW</div><h1>THE MONTHLY HEIST</h1><p>40 players. Three missions. One leaderboard.</p><section id="entry" class="card"><h2>Join the crew</h2><input id="name" placeholder="Your player name" maxlength="30" aria-label="Player name"><input id="room" placeholder="Room code" maxlength="6" aria-label="Room code"><button id="join">Join game</button><hr><p class="muted">Hosting the Monthly?</p><button id="create">Create a new room</button></section><section id="game" class="hide"><div class="card"><div class="pill" id="role"></div><h2 id="headline"></h2><p id="prompt"></p><div id="choices" class="grid"></div><div id="feedback" class="muted"></div><div id="hostActions" class="hide"><button id="start">Start game</button><button id="reveal">Reveal answers</button><button id="next">Next mission</button></div></div><div class="card"><h2>🏆 Live leaderboard</h2><p id="counter" class="muted"></p><div id="scores"></div></div></section><p id="msg" role="status" aria-live="polite"></p></main><script>
const $=id=>document.getElementById(id);let code='',id='',token='',isHost=false,current=null,selectedCharacter=null;
async function api(endpoint,payload){const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function error(e){$('msg').textContent=e.message||String(e)}
function connect(){let stream=new EventSource('/events?room='+encodeURIComponent(code));stream.onmessage=e=>{current=JSON.parse(e.data);render()};stream.onerror=()=>{$('msg').textContent='Connection interrupted. Reconnecting…'};$('entry').classList.add('hide');$('game').classList.remove('hide');$('role').textContent=(isHost?'HOST':'PLAYER')+' • ROOM '+code}
$('create').onclick=async()=>{try{let j=await api('create',{});code=j.code;token=j.token;isHost=true;connect()}catch(e){error(e)}};
$('join').onclick=async()=>{try{let j=await api('join',{code:$('room').value,name:$('name').value});code=j.code;id=j.id;connect()}catch(e){error(e)}};
async function host(action){try{await api('host',{code,token,action})}catch(e){error(e)}}$('start').onclick=()=>host('start');$('reveal').onclick=()=>host('reveal');$('next').onclick=()=>host('next');
function choice(label,i,handler,selected,disabled){let b=document.createElement('button');b.textContent=label;b.className=selected?'selected':'';b.disabled=disabled;b.onclick=handler;return b}
function render(){if(!current)return;$('msg').textContent='';$('choices').replaceChildren();let r=current,me=r.players.find(p=>p.id===id);$('counter').textContent=r.players.length+' players • '+r.answers+' answered this mission';$('scores').replaceChildren();r.players.forEach((p,i)=>{let div=document.createElement('div');div.className='score';let left=document.createElement('span');left.textContent=(i+1)+'. '+p.name+(p.character!==null?' • '+['Boss','Hacker','Speedrunner','Coffee NPC','Mogul','Tourist'][p.character]:'');let right=document.createElement('strong');right.textContent=p.score+' XP';div.append(left,right);$('scores').append(div)});
$('hostActions').classList.toggle('hide',!isHost);$('start').hidden=!(isHost&&r.phase==='lobby');$('reveal').hidden=!(isHost&&r.phase==='playing'&&!r.reveal);$('next').hidden=!(isHost&&r.phase==='playing'&&r.reveal);
if(r.phase==='lobby'){$('headline').textContent='SELECT YOUR CHARACTER';$('prompt').textContent='Pick your current work mood. Share the room code with your crew: '+code;['😎 The Boss','💻 The Hacker','🏎️ The Speedrunner','☕ Coffee NPC','💰 Business Mogul','🏖️ The Tourist'].forEach((x,i)=>$('choices').append(choice(x,i,async()=>{if(isHost)return;try{await api('character',{code,id,character:i})}catch(e){error(e)}},me&&me.character===i,isHost)));$('feedback').textContent=isHost?'Share this page URL and room code with participants, then press Start game.':'Waiting for host to start.';return}
if(r.phase==='finished'){$('headline').textContent='MISSION PASSED!';$('prompt').textContent='Respect +100 • Team spirit +500';$('feedback').textContent='The Monthly begins now!';return}
$('headline').textContent='MISSION '+(r.round+1)+' • '+r.mission.title;$('prompt').textContent=r.mission.prompt;r.mission.options.forEach((x,i)=>$('choices').append(choice('ABCD'[i]+'. '+x,i,async()=>{try{await api('answer',{code,id,answer:i});$('feedback').textContent='Answer locked!'}catch(e){error(e)}},false,isHost||r.reveal||!!me?.answered)));
$('feedback').textContent=r.reveal?'✅ '+r.mission.explain+' Correct: '+('ABCD'[r.mission.correct]):isHost?'Wait for players to answer, then reveal.':me?.answered?'Answer locked. Waiting for reveal…':'Choose one answer before the host reveals.'}
</script></html>
